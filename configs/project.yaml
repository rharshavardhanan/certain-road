# RoadSight project configuration.
#
# Amended from the T0 specification by D055 (taxonomy) and D056 (packaging).
# The spec's `classes: {0: D00, 1: D10, 2: D20, 3: D40}` and its hard-coded
# pothole index 3 do not apply here: this repo's taxonomy has been frozen at the
# D038 three-class merge since 2026-08-07. Read `pothole_class` — never a
# literal 3, which is not a valid index in this taxonomy.

seed: 0

# D038/D055: D00 and D10 share one ASTM D6433 deduct curve, so they are one class.
classes: {0: linear_crack, 1: alligator_crack, 2: pothole}
pothole_class: 2

countries:
  india: India
  nonindia: [Japan, Czech, Norway, United_States, China_MotorBike, China_Drone]

paths: {raw: data/raw/RDD2022, yolo: data/yolo, splits: splits, results: results, runs: runs}

split:
  nonindia_val_frac: 0.20
  india_block_size: 50
  india_fracs: {india_train: 0.60, india_val: 0.10, india_cal: 0.15, india_test: 0.15}
  replay_n: 5000
  max_side: 1280
  min_box_px: 2

train_A: {model: yolov8s.pt, imgsz: 640, epochs: 40, patience: 10, batch: 32, optimizer: AdamW,
          lr0: 0.001, lrf: 0.01, mosaic: 1.0, close_mosaic: 10, fliplr: 0.5, translate: 0.1,
          scale: 0.5, seed: 0, deterministic: true, save_period: 5, workers: 4}

train_B: {imgsz: 640, epochs: 25, patience: 8, batch: 32, optimizer: AdamW, lr0: 0.0005, lrf: 0.01,
          close_mosaic: 5, seed: 0, deterministic: true, save_period: 5, workers: 4}

# D056: kernels install only `ultralytics==<pin>` + pycocotools, never requirements.txt.
kaggle: {username: harshavardhananr, dataset_slug: roadsight-rdd-yolo, accelerator: NvidiaTeslaT4}

# Frozen evaluation settings (D068). Every reported number - eval_open, eval_locked,
# Model A and Model B alike - uses exactly these, and the lock metadata stamps them.
# Comparing two models under different settings compares the settings.
#
# Values confirmed in the installed ultralytics 8.4.115 source, not assumed:
#   iou 0.7      cfg/default.yaml:56  (NMS IoU threshold)
#   conf 0.001   cfg/default.yaml:55  (val default; predict defaults to 0.25)
#   max_det 300  cfg/default.yaml:57
#   imgsz 640    cfg/default.yaml:16
#   rect False   cfg/default.yaml:32, and detect/val.py passes no rect kwarg to
#                build_yolo_dataset, which resolves `rect=cfg.rect or rect`.
#                Pinned explicitly because rect=True letterboxes to 672 and this
#                project has already measured that shifting mAP50 by ~0.03.
# half: false and device: cpu because MPS lacks deterministic kernels for several
# ops used here (T4), so CPU is the result another machine can reproduce.
eval:
  conf: 0.001
  iou: 0.7
  max_det: 300
  imgsz: 640
  rect: false
  half: false
  device: cpu
  report_conf: 0.25   # operating point for the P/R table, not for mAP

# D070: the spec's 0.05/0.10/0.20 are all infeasible for Model A on India (floor
# 0.64), so 0.30-0.70 are added to let A's India case and the transfer violation
# appear in the table at all. The full floor-to-0.96 curve is drawn separately.
conformal: {alphas: [0.05, 0.10, 0.20, 0.30, 0.50, 0.70], iou: 0.5, n_resamples: 200,
            tau_step: 0.001, curve_alpha_step: 0.02}

# D078: the spec's plain martingale sinks ~0.19 nats/frame in-domain and misses a
# late shift. The CUSUM reset is run beside it. Its threshold is chosen by a rule
# fixed before any shift result was seen: the smallest grid value whose null
# false-alarm rate is within the spec's own budget of 1/alarm_threshold.
drift: {eps: 0.5, alarm_threshold: 100, topk: 3, n_streams: 200, null_prefix: 500,
        cusum_threshold_grid: [100, 1000, 10000, 100000]}

# D055: the spec's D00 and D10 both carried weight 8 precisely because they share
# a deduct curve; merged, that is one weight of 8.
scoring:
  segment_m: 50
  lane_width_m: 3.5
  deduct_weights: {linear_crack: 8, alligator_crack: 20, pothole: 30}

# T12 synthetic network (D079). Generator parameters were fixed by looking at the
# TRUE vision-estimated PCI distribution alone, before any policy was run, so they
# cannot have been tuned toward a result. Target declared before adjusting:
# median in Satisfactory, 10-20% Poor or worse. 8/2/4 gave 82.0 and 3.8%;
# 16/4/8 gives 71.1 and 20.7%; 24/6/12 gives 63.2 and 35.3%. Units of cost
# are arbitrary.
allocation:
  n_segments: 200
  n_trials: 1000
  budget_fractions: [0.10, 0.20, 0.30, 0.40, 0.50]
  worst_k: 20
  mobilisation_cost: 50000
  cost_per_m2: 2500
  severity_gamma: {shape: 1.2, scale: 1.0}      # per-segment damage level, right-skewed
  instances_per_severity: {linear_crack: 16, alligator_crack: 4, pothole: 8}
  footprint_median_m2: {linear_crack: 0.3, alligator_crack: 2.0, pothole: 0.25}
  footprint_log_sigma: 0.6
  traffic_log_sigma: 0.8
  # Operating point: the tightest certified alpha at which Model B raises fewer
  # than this many false alarms per image (T10, D077). The simulation models
  # misses, not false alarms, so it is only honest where false alarms are rare.
  max_false_alarms_per_image: 1.0
  sensitivity_alphas: [0.10, 0.30]
  workers: 14

sim: {speed_kmh: 20, slow_kmh: 10, cam_height_m: 1.3, cam_pitch_deg: 10, cam_fov_rad: 1.2,
      cam_w: 1280, cam_h: 720, lane_center_y: -1.75, lane_width_m: 3.5, margin_m: 0.2,
      lookahead_m: 8.0, perceive_every_steps: 3, conf: 0.35, latency_s: 0.15, a_lat: 2.0,
      a_brake: 4.0, swerve_m: 0.8, road_length_m: 500, n_potholes: 28, seeds: [0, 1, 2]}

edge: {sample_every_m: 5, dedup_m: 2.5, imu_hz: 100, can_hz: 10, obd_bitrate: 500000,
       detect_range_m: 12.0}
