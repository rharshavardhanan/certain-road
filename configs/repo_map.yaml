# scripts/repo_map.py -> docs/REPO-MAP.md. Only what is not evidence lives here:
# where to look, how to group, and which stage a script belongs to. Every number,
# date and status in the document is read at build time.
output: docs/REPO-MAP.md

# First path segments that mark a string literal in a script as a repository path.
path_roots: [results, data, runs, configs, docs, models, kaggle, scripts, src, tests]

# Section 1: quoted verbatim, from the start line up to (not including) the stop line.
quotes:
  - {file: CLAUDE.md, start: "# certain-road", stop: "## Read these first"}
  - {file: docs/design.md, start: "## §0 — What this is", stop: "### Reported results"}

# Section 2: the survey pipeline's stages and the scripts that carry each. Edge
# labels are derived: the paths the earlier stage writes that the later one reads.
# The source stage has no script; its edge lists the next stage's reads under
# `source_under`.
pipeline:
  - {stage: Raw data, scripts: [], source_under: [data/raw]}
  - {stage: Conversion, scripts: [build_pool.py]}
  - {stage: Splits, scripts: [build_pool.py]}
  - {stage: Training, scripts: [stage_upload.py, kaggle_push.py, kaggle_watch.py]}
  - {stage: Locked evaluation, scripts: [eval_locked.py]}
  - {stage: Conformal, scripts: [exp_conformal.py]}
  - {stage: Scoring, scripts: [exp_allocation.py]}
  - {stage: Optimiser, scripts: [exp_allocation.py]}
  - {stage: Dashboard and report, scripts: [build_dashboard.py, make_report.py]}

# Section 3: one table per area, in this order; anything else goes in a final table.
areas: [src, scripts, configs, tests, results, docs, kaggle, data]
# A directory holding more files than this directly becomes one row, unless it
# holds any file of a documentable type (code and docs are always listed).
collapse_over_files: 25
never_collapse: [.py, .md, .yaml, .yml, .toml]
# data/ is gitignored, so it is listed by directory down to this depth.
untracked_depth: 2

# Paths owned by the video-evaluation session: inventoried, never modified.
read_only_lane:
  - scripts/eval_video.py
  - scripts/exp_video_extent.py
  - scripts/score_video_gt.py
  - tests/test_eval_video.py
  - tests/test_score_video_gt.py
  - configs/eval/video.yaml
  - configs/eval/gt/
  - results/video/

# Section 7 and 10b: files never counted as citing a decision. The log defines them;
# the map's own files quote D-numbers as code and test data.
citation_exclude:
  - docs/DECISIONS.md
  - scripts/repo_map.py
  - tests/test_repo_map.py
  - configs/repo_map.yaml

# Section 8: the training arguments shown from each run's args.yaml, and the
# precision of evaluation numbers.
train_args: [model, data, epochs, batch, imgsz, optimizer, lr0, patience]
decimals: 4

# Section 10c: comment markers and where to look for them.
todo_markers: [TODO, FIXME, XXX]
todo_scan: [src, scripts, tests, configs, kaggle]

# Section 10c and scripts/check_repo.py: generated files are rebuilt in memory and
# compared with what is on disk, everything but the stamp line (a regex). A clone
# resets modification times, so freshness is judged by content, not by mtime (C6).
generated:
  - path: results/RESULTS.md
    script: make_report.py
    stamp: "^Generated by `scripts/make_report.py`"
    # C5: these two sections render the video lane's uncommitted work
    # (results/video/; D075 and D080-D082 in docs/DECISIONS.md), so a clone, which
    # lacks it, rebuilds them differently. A difference inside them is reported, not
    # failed. Remove this exception when the lane commits.
    except_sections: ["## Video", "## Decision log status"]
    reason: "C5: renders the video lane's uncommitted work; reported, not failed, until it is committed"
  - path: results/dashboard/index.html
    script: build_dashboard.py
    stamp: 'class="stamp"'
    except_sections: []
    reason: ""


# Sections 2 and 11: a path links two scripts only if this many leading segments
# are concrete. `results/*/val` (an output directory named on the command line)
# matches nearly everything in results/, so it says nothing about who produced what.
link_fixed_segments: 2

# Section 11: a script whose code (docstrings excluded) names one of these words
# needs that resource to run.
external:
  Kaggle: [kaggle]
  Jetson: [jetson]
