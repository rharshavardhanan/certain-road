# Camera calibration for the robot (scripts/calibrate_camera.py, ros/WORKLOG §16 step 2).
# Print `checkerboard.png` (python scripts/calibrate_camera.py board) at 100% scale on A4, check
# one square with a ruler, and correct `square_m` if the printer scaled it.
board:
  inner_corners: [9, 6]        # corners where four squares meet, across x down
  square_m: 0.025              # side of one square as printed
  print_dpi: 300
camera:
  device: /dev/video0
  size: [1280, 720]            # the C920's 720p mode, MJPG over USB 2
  # Used only until `intrinsics` has run: Logitech's 78 deg diagonal field of view at 16:9
  # gives ~70.4 deg horizontal. Calibrating replaces it with the measured focal length.
  nominal_hfov_deg: 70.42
intrinsics:
  views: 15                    # board captures, from different angles and distances
  min_move_px: 60              # a new auto-capture needs the board this far from the last one
  max_rms_px: 1.0              # a worse fit is refused, not saved
mount:
  frames: 40                   # frames averaged for height, pitch and roll
out: configs/robot/camera_c920.yaml   # measured results, committed as provenance
# A checkerboard shown full-screen on a phone instead of a print (`--target phone`). The script
# writes checkerboard_phone.png at the screen's own resolution; open it full-screen, brightness
# up, auto-rotate off. MEASURE one square on the screen with a ruler and correct `square_m`:
# gallery apps can scale the picture. Lying flat, the screen is `thickness_m` above the floor.
phone:
  model: Samsung Galaxy A54
  screen_px: [2340, 1080]      # landscape
  inner_corners: [7, 4]        # 8 x 5 squares: one side odd, so the board has no 180-degree twin
  square_px: 200
  square_m: 0.0126             # 200 px at the A54's ~403 ppi: check with a ruler
  thickness_m: 0.0082          # A54 body thickness
