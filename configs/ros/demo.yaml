# ROS 2 Jazzy demo (ros/certain_road_ros, D093): the drive decision as ROS nodes around
# any camera source.
#
#   sim_node         the 2D simulator: camera frames, ground truth and pose out; /cmd_vel
#                    in, applied through certain_road.sim.model.step
#   video_node       a road video as a camera: frames out, open loop (nothing to steer)
#   perception_node  frames in (any /camera/image_raw); vision_msgs/Detection2DArray out
#   planner_node     detections in; corridor + Confirmer + state machine, unchanged;
#                    the Command leaves through RosTransport as /cmd_vel and, when the
#                    bus is up, through CanTransport as a CAN frame
#   can_monitor_node CAN frames in, decoded with Command.from_bytes; text out
#
#   lane_keeper_node the Gazebo closed loop's STAND-IN DRIVER (not under test): holds the
#                    lane while the planner is NORMAL or WARNING, passes its Twist otherwise
#
# Every tunable the ROS layer adds lives here. Robot and camera geometry stay in
# configs/sim/robot.yaml (the indoor robot) and configs/sim/car.yaml (the Gazebo car), the
# corridors and policy in configs/driving/, the weights and the clip's ground truth in
# configs/eval/video.yaml, the CAN frame layout in configs/canbus/transport.yaml.

# Which vehicle the planner drives and which corridor it judges with: planner_node's
# vehicle:= and corridor:= parameters name an entry here (corridor:= defaults to the
# vehicle's own). robot is the indoor robot of the 2D sim and the road video, the default;
# car is the Gazebo camera car, both files generated by sim/gazebo/package.py from
# configs/sim/gazebo.yaml and the design numbers (configs/driving/corridor_car.yaml shows
# its derivation). RosTransport and can_monitor_node read the same profile, so a CAN
# payload's normalised speed and steer mean the same m/s and rad as its /cmd_vel.
profiles:
  default: robot
  vehicles: {robot: configs/sim/robot.yaml, car: configs/sim/car.yaml}
  corridors: {robot: configs/driving/corridor.yaml, car: configs/driving/corridor_car.yaml}

frames:
  world: map
  robot: base_link
  camera: camera_link

topics:
  image: /camera/image_raw
  camera_info: /camera/camera_info    # latched from sim_node and video_node; the planner's image size
  ground_truth: /sim/ground_truth     # certain_road.sim.project's boxes, the projection-only input
  frame_info: /video/frame_info       # per frame from video_node: video time and ground truth in view
  pose: /sim/pose
  path: /sim/path
  world_markers: /sim/markers
  scenario: /sim/scenario             # latched; a new value starts an episode
  detections: /perception/detections
  annotated: /perception/image_annotated
  source: /perception/source          # latched; what the detections came from
  cmd_vel: /cmd_vel
  drive_state: /planner/drive_state
  planner_markers: /planner/markers
  can_decoded: /can/decoded           # can_monitor_node: each frame on the bus, decoded, as text
  # The Gazebo closed loop (certain_road_ros gazebo.launch.py): the planner's Twist is
  # remapped to planner_cmd_vel, and lane_keeper_node sends the car's /cmd_vel.
  planner_cmd_vel: /planner/cmd_vel
  odom: /odom                         # Gazebo's true pose (OdometryPublisher), the stand-in's input
  lane_keeper_state: /lane_keeper/state
  gazebo_road: /gazebo/road           # road_markers_node: the exported road's ground truth, latched
  gazebo_path: /gazebo/path           # the car's true track

sim:
  # The trial matrix (certain_road.sim.scenario), driven in turn and then from the top.
  # Each runs its own frame count at its own dt, in real time: one frame every dt.
  scenarios: [centre, left, right, multiple, blocked_left, blocked_right, blocked_both, clear]
  # demo.launch.py's default source:= for the closed loop. The 2D sim's flat-shaded frames
  # are far from the RDD2022 photos the detectors learned from; with the weights present
  # (D094) `auto` picks the detector, it does not fire on the renders, and every episode
  # stays NORMAL. So the sim defaults to its projected boxes, labelled PROJECTION-ONLY;
  # source:=detector still runs the models on the renders. Video and Gazebo cameras keep
  # perception.source.
  perception_source: projection
  # The vehicle's own watchdog, independent of the planner's staleness failsafe: no
  # /cmd_vel for this many frames and it stops. A real drive controller has one too.
  cmd_timeout_frames: 3
  camera_mount_x_m: 0.10              # camera_link ahead of base_link; the TF tree only
  marker_height_m: 0.10               # robot body marker
  flat_marker_m: 0.002                # thickness of the road and pothole markers
  road_marker: {x: [-0.5, 4.5], y: [-1.0, 1.0], rgba: [0.33, 0.33, 0.32, 1.0]}
  pothole_rgba: [0.08, 0.07, 0.06, 1.0]
  robot_rgba: [0.17, 0.37, 0.66, 0.9]

perception:
  # auto: the detectors if torch, ultralytics and both weights files load, else
  # projection-only, said loudly in the log, on /perception/source and on the image.
  # The default for any camera; demo.launch.py overrides it with sim.perception_source.
  source: auto                        # auto | detector | projection
  # D082: potholes from Model P only, cracks from Model B only; never summed.
  classes_from: {P: [pothole], B: [linear_crack, alligator_crack]}
  conf: 0.25                          # = configs/eval/video.yaml conf
  imgsz: 640                          # YOLO input; any frame is letterboxed to it (= eval imgsz)
  sync_queue: 10                      # frames held while pairing an image with its ground truth
  # Pair each frame with /sim/ground_truth: auto = only while that topic has a publisher
  # (sim_node), so any other camera runs detector-only; on = always wait for it; off = never.
  ground_truth: auto                  # auto | on | off
  frame_info_queue: 30                # /video/frame_info messages kept for pairing by stamp
  stop_poll_s: 0.1                    # a stop signal is acted on between frames, checked this often
  overlay:
    colours_bgr: {pothole: [40, 40, 230], linear_crack: [0, 215, 255],
                  alligator_crack: [0, 140, 255], truth: [235, 235, 235],
                  corridor: [168, 95, 43], banner: [20, 20, 20], text: [240, 240, 240],
                  warn: [0, 165, 255]}
    corridor_alpha: 0.22
    box_px: 2
    truth_px: 1
    font_scale: 0.55
    banner_px: 26
    # Frames wider than this draw text, strips and boxes larger by width / scale_ref_px, so a
    # 1280 px video reads as the 640 px sim frame does once RViz fits it to the panel.
    scale_ref_px: 800

planner:
  # Cracks are survey material (D049). Only potholes steer the robot.
  hazard_classes: [pothole]
  # How often the staleness failsafe is checked. The failsafe itself is the policy's
  # max_frame_age (configs/driving/decision.yaml), counted in the scenario's dt.
  watchdog_period_s: 0.05
  log_dir: runs/ros                   # runs/ros/<UTC stamp>/episodes.jsonl, one line per episode
  # Staleness clock for a camera that sends no /sim/scenario (realtime video, Gazebo): the
  # failsafe stops after max_frame_age of these. The sim's own scenario dt replaces it, as
  # before. Off for lockstep video, whose clock is the video's (planner_node docstring).
  frame_period_s: 0.1
  frame_info_cache: 120               # /video/frame_info kept to give each decision its video time
  text_height_m: 0.12
  text_z_m: 0.45
  state_rgba:
    normal: [0.30, 0.75, 0.45, 1.0]
    warning: [0.95, 0.75, 0.20, 1.0]
    avoid_left: [0.95, 0.55, 0.15, 1.0]
    avoid_right: [0.95, 0.55, 0.15, 1.0]
    stop: [0.90, 0.25, 0.20, 1.0]

# The Gazebo closed loop's stand-in driver (lane_keeper_node, gazebo.launch.py). NOT UNDER
# TEST: a human driver holds the lane; the planner (the thing under test) does not, since
# NORMAL means steer 0, and a 500 m road with pothole knocks drifts a car out of its lane
# (sim/gazebo capture, constant command: 1.4 m by 512 m). While the planner is in one of
# `steers_in` the stand-in steers back to the lane centre from Gazebo's TRUE pose
# (/odom); in every other state (AVOID_LEFT, AVOID_RIGHT, STOP) it passes the planner's
# Twist unchanged. It always drives at the planner's speed. The CAN frames carry the
# planner's own Command, never the stand-in's steering.
#   yaw rate = -(k_lateral e_y + k_heading e_yaw), clipped: at 5.6 m/s a 1.3 rad/s,
#   0.58-damped return to the lane centre - a calm driver, not a test subject.
lane_keeper:
  rate_hz: 30.0                       # = the camera's: one Twist per frame of simulated time
  k_lateral: 0.3                      # rad/s per metre off the lane centre
  k_heading: 1.5                      # rad/s per rad of heading off the road's
  max_yaw_rate: 0.3                   # rad/s
  steers_in: [normal, warning]
  # No planner Twist for this long (simulated seconds): the stand-in stops the car, as the
  # vehicle's own watchdog would. The planner's staleness failsafe acts first.
  planner_timeout_s: 0.5

# RViz's top-down view of a Gazebo run (road_markers_node): the exported world's ground
# truth (ground_truth.json) and the car's true track from /odom, in Gazebo's odom frame.
gazebo_view:
  frame: odom
  surface_z_m: -0.02                  # under the road's own level, so the car stays visible
  flat_m: 0.02                        # thickness of the road and damage markers
  road_rgba: [0.33, 0.33, 0.32, 1.0]
  line_rgba: [0.92, 0.92, 0.88, 1.0]
  line_width_m: 0.10
  centre_dash_m: [3.0, 4.5]           # = configs/sim/mujoco.yaml road.centre_dash_m
  class_rgba: {pothole: [0.85, 0.15, 0.12, 1.0], alligator_crack: [0.95, 0.55, 0.10, 0.7],
               linear_crack: [0.95, 0.85, 0.10, 0.7]}
  label_height_m: 0.5
  path_every_s: 0.1                   # simulated seconds between track points

# A road video as the camera (video_node, video.launch.py). OPEN LOOP: a recording cannot be
# steered, so the planner decides on every frame and nothing it sends changes what is seen.
video:
  clip: data/video/2DV-cYmIvT4.mp4    # video.launch.py's default video:=
  # configs/eval/video.yaml's `live` block (ground truth CSV, window, credit) describes this
  # clip only. Any other clip plays whole, with no ground truth.
  gt_clip_stem: 2DV-cYmIvT4
  # lockstep: the next frame goes out only once the detections for the last one are back, so
  #   every frame is processed and the planner's 3-of-5 confirmation (D051, D075, D088) sees
  #   the clip's 30 fps. Plays slower than real time.
  # realtime: frames at the clip's own rate by the wall clock; perception keeps the newest,
  #   so frames are dropped when the GPU falls behind and 3-of-5 no longer means 0.1 s.
  pacing: lockstep                    # lockstep | realtime
  lockstep_timeout_s: 5.0             # no detections for a frame this long: warn, send the next
  start_delay_s: 1.0                  # after the whole graph is connected, before frame 0
  sent_memory: 120                    # recent frames' stamps kept, to recognise their detections
  loop: false                         # at the window's end: false = stop (the launch exits)
  notice: "OPEN LOOP: a recording cannot be steered - decisions are shown, not applied"
  pacing_label: {lockstep: "LOCKSTEP: every frame processed",
                 realtime: "REALTIME: frames dropped"}

# CAN (D049, D052): every Command the planner sends also leaves as a real frame. This
# overrides configs/canbus/transport.yaml's interface and channel for the ROS demo only,
# so that file keeps the Mac's python-can `virtual` default; the arbitration ID and the
# 4-byte layout stay there. vcan0 comes from ros/install_gazebo_can.sh; watch it with
# `candump vcan0`. On a real bus this becomes can0.
can:
  interface: socketcan
  channel: vcan0
  # auto: send when the bus opens, else /cmd_vel only, said in the log; true: the bus must
  # open; false: no CAN. The launch files' can:= argument overrides it.
  enabled: auto                       # auto | true | false
  recv_timeout_s: 0.2                 # can_monitor_node's reader wakes this often to notice shutdown
  log_every_frame: true               # can_monitor_node logs each decoded frame, not only changes
