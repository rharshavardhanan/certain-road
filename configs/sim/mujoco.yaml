# MuJoCo live survey demo (sim/mujoco). Every tunable the simulator uses.
# The camera is NOT here: it is the `sim:` block of configs/project.yaml (1.3 m high,
# 10 deg down, HFOV 1.2 rad, 1280x720), the numbers the design was computed for.

textures: configs/sim/textures.yaml
out_dir: runs/mujoco
copy_check_corr: 0.98          # D066: cross-dataset "same file" threshold

road:
  length_m: [400, 600]
  lane_width_m: 3.5            # = scoring.lane_width_m
  drive_lane_y: 1.75           # keep left (India): left lane centre, y is left
  marking_width_m: 0.10
  centre_dash_m: [3.0, 4.5]    # dash, gap
  edge_line_inset_m: 0.15
  kerb: {width_m: 0.25, height_m: 0.15, stripe_m: 1.0}
  shoulder_m: 2.5
  clean_start_m: 20            # no damage under the first frames

surface:
  px_per_m: 200
  tile_m: 12.8
  asphalt_level: {mean: [118, 117, 114], std: 22}   # common tone, RGB
  flatten_sigma_frac: 0.15     # illumination removal: blur sigma as a fraction of size
  wheelpath_darkening: 0.06
  lowfreq_variation: 0.05
  feather: 0.35                # fraction of the ellipse radius that fades
  edge_noise: 0.18
  colour_match_std: 0.0        # keep the photo's contrast; only the mean shifts
  colour_match_percentile: 60  # the rim's clean surface, above the dark cracks
  colour_match_mean: 0.8       # how far the rim's mean moves to the asphalt's
  crack_contrast: {linear_crack: 1.6, alligator_crack: 2.6}   # dark lines deepened for a 10 m view
  widen_lines: [alligator_crack]   # thin networks need it to survive mip blur; single cracks turn to gashes
  pothole_depth_shade: 0.22    # interior darkening of a depression
  pothole_wall_shade: 0.35     # extra shadow on the sun-side wall
  water_sheen: 0.4             # smooth water reflects the sky at the dashcam's grazing angles
  water_smoothness: 0.035      # local std (0-1) below which a pothole pixel counts as water

damage:
  # enlargement over the photographed scale: alligator areas run 1.5-3 m on real roads
  natural_scale: {alligator_crack: [1.4, 2.2], linear_crack: [1.0, 1.6]}
  pothole_diameter_m: [0.3, 1.2]   # across the major axis; real Indian potholes
  lateral_in_drive_lane: 0.7
  wheelpath_offset_m: 0.9
  cluster_sigma_m: [2.5, 0.6]  # along, across
  attach_pothole_to_alligator: 0.7
  max_overlap: 0.3
  window_m: 12.0               # one RDD India frame's stretch (edge.detect_range_m)

presets:                       # expected instances per 100 m; pothole_total overrides
  good:     {linear_crack: 1.5, alligator_crack: 0.0, pothole: 0.0}
  moderate: {linear_crack: 4.0, alligator_crack: 2.0, pothole_total: [2, 3]}
  poor:     {linear_crack: 5.0, alligator_crack: 8.0, pothole: 6.0}
  mixed:    {good: {linear_crack: 1.5, alligator_crack: 0.0, pothole: 0.0},
             poor: {linear_crack: 5.0, alligator_crack: 8.0, pothole: 6.0},
             switch_frac: [0.4, 0.6]}
  random:   {source: results/T2/split_audit.json, split: india_train}
clusters_per_instance: 0.4     # parents per child, Thomas process

scene:
  sky: {top: [0.42, 0.58, 0.82], horizon: [0.86, 0.89, 0.92]}
  sun_dir: [-0.35, -0.55, -0.76]  # light travels to -y: poles on the left cast shadows across the road
  sun_diffuse: 0.85
  ambient: 0.38
  haze: {start_m: 60, end_m: 420, rgb: [0.82, 0.85, 0.88]}
  shadow_size: 4096
  shadow_box_m: 40
  pole_spacing_m: [30, 45]
  pole_height_m: 8.5
  pole_offset_m: 1.4
  wall: {height_m: 1.8, offset_m: 3.2, length_frac: [0.3, 0.6]}
  signs_per_km: 6

camera_effects:
  supersample: 3              # MuJoCo has no anisotropic filtering; 2x keeps grazing texture sharp
  exposure_s: 0.004          # daylight dashcam, ~1/250 s
  blur_subframes: 5
  pitch_noise_deg: 0.35
  roll_noise_deg: 0.25
  noise_corr_m: 3.0
  sensor_noise: 2.5            # 0-255 sigma
  vignette: 0.12
  contrast: 1.06
  jpeg_quality: 72
