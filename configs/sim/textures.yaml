# Textures for the MuJoCo demo (sim/mujoco/textures.py).
#
# The photos live in data/raw/trial_textures/ (gitignored), copied from
# indian_road_textures.zip. They are NOT the user's own photos. Both datasets are
# CC BY 4.0 and must be credited wherever the demo is shown or published:
#   QR4Change: Maske Y., Jakate S., Thakare C., Lokhande S. (2025). Urban Civic Issues
#     Image Dataset: Potholes and Garbage. Mendeley Data V2, doi:10.17632/zndzygc3p3.2.
#     Pune, Maharashtra, India.
#   BD-N6: Hossain M.N., Aman N., Antor N.R., Tasnim N., Azam M.Z., et al. Flexible
#     Pavement Distress Image Dataset ... National Highway N6, Bangladesh, Parts 1 & 2.
#     Zenodo, doi:10.5281/zenodo.18072573 and doi:10.5281/zenodo.18114226.
#
# Every entry below was set by eye from a coordinate-grid contact sheet. `crop` is
# [x0, y0, x1, y1] as fractions of the image (x right, y down). The ground-truth class
# of a placed instance is the class written here, never the folder name: the
# "2_linear_cracks" folder was drawn from BD-N6's alligator category, and two of its
# images show network cracking, so they are excluded rather than relabelled.

root: data/raw/trial_textures

# BD-N6 photos are near-vertical smartphone shots. Aggregate stones of roughly 10 mm
# span about 20 px at the delivered 3000 px long side, so 2000 px/m. Placed at that
# scale (randomised within the range in mujoco.yaml), cracks keep a true width and the
# grain keeps a true size. The QR4Change pothole photos are oblique with no usable
# scale, so potholes take their size from the design footprint instead.
natural_px_per_m: {bd_n6: 2000}
sources: {1_potholes_india_pune: qr4change, 2_linear_cracks: bd_n6, 3_alligator_cracks: bd_n6,
          4_plain_asphalt: bd_n6}

asphalt:   # the road base: tiled, flattened and levelled (surface.py)
  - {file: 4_plain_asphalt/plain_01.jpg}
  - {file: 4_plain_asphalt/plain_02.jpg}
  - {file: 4_plain_asphalt/plain_03.jpg}
  - {file: 4_plain_asphalt/plain_04.jpg}

