[project]
name = "certain-road"
version = "0.1.0"
description = "Pavement management decision support: which road segments to repair first under a fixed budget."
readme = "README.md"
authors = [
    { name = "rharshavardhanan", email = "rharshavardhanan@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "folium>=0.20.0",
    "kaggle>=2.2.4",
    "lap>=0.5.13",
    "matplotlib>=3.11.1",
    "mujoco>=3.14.0",
    "obd>=0.7.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pulp>=3.3.2",
    "pyarrow>=25.0.0",
    "pycocotools>=2.0.11",
    "pydantic>=2.13.4",
    "pyserial>=3.5",
    "python-can>=4.6.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
    "streamlit-folium>=0.27.4",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
    "ultralytics>=8.4.115",
]

[project.scripts]
certain-road = "certain_road.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
