[develop]
script_dir=$base/lib/certain_road_ros
[install]
install_scripts=$base/lib/certain_road_ros
# The nodes run on the project's uv venv, which holds certain_road, torch and ultralytics;
# `env python3` picks it up from ros/env.sh. The ROS docs' recipe for venvs.
[build_scripts]
executable = /usr/bin/env python3
